name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  architecture:
    name: Layer & engine containment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The guard is stdlib-only, so it can run before installing anything.
      - name: Dependency direction
        run: python scripts/check_layers.py

  python:
    name: Python tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v

  gui:
    name: GUI build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b --noEmit
      - name: Build bundle into the Python package
        run: npm run build
      - name: Bundle was emitted
        run: test -f ../onion_harness/app/static/index.html