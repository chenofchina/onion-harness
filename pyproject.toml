[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onion-harness"
version = "0.1.0"
description = "Onion Harness - a layered local AI agent runtime with a self-modifying, rollback-safe control plane."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Onion Harness" }]
dependencies = [
    "loong-agent==0.0.2",
    "pywebview>=5.0",
    "httpx>=0.27",
    # Trusts the OS certificate store, so TLS-intercepting antivirus and
    # corporate proxies do not break every request.
    "truststore>=0.9",
    # AES-256-GCM for the encrypted memory database.
    "cryptography>=42",
    # Windows Credential Manager access, where API keys and the master secret
    # live. Windows-only, but declaring it unconditionally keeps the frozen
    # build and CI identical on every platform.
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2"]

[project.scripts]
onion-harness = "onion_harness.app.main:main"

[tool.setuptools.packages.find]
include = ["onion_harness*"]

[tool.setuptools.package-data]
"onion_harness.app" = ["static/**/*", "static/*", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"